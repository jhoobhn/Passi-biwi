<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Arshama ❤️</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .gradient-background {
      background: linear-gradient(180deg, #ffdae9 0%, #fee2fe 100%);
    }
    .bounce {
      animation: bounce 2s infinite;
    }
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
      40% {transform: translateY(-20px);}
      60% {transform: translateY(-10px);}
    }
  </style>
</head>
<body class="gradient-background">
  <audio id="bgMusic" loop>
    <source src="https://www.myinstants.com/media/sounds/titanic-theme-song.mp3" type="audio/mpeg">
  </audio>

  <div class="flex items-center justify-center h-screen">
    <div class="flex flex-col items-center p-4 text-center">
      <img id="imageDisplay" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHIycXByZ3R3Z3R3Z3R3Z3R3Z3R3Z3R3Z3R3Z3R3Z3R3Z3R3ZiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/cLS1cfxvGOPVpf9g3y/giphy.gif" alt="Cute bear" class="rounded-md h-[300px] object-cover" />
      
      <h2 id="valentineQuestion" class="text-4xl font-bold italic text-[#bd1e59] my-4">Will you be my Valentine, Arshama? ❤️</h2>
      
      <div class="flex gap-4 pt-[20px] items-center" id="responseButtons">
        <button id="yesButton" class="bounce inline-flex items-center justify-center rounded-md text-[20px] font-medium bg-green-500 text-white px-4 py-2 hover:bg-green-400 transition-all">
          Yes
        </button>
        <button id="noButton" class="inline-flex items-center justify-center rounded-md text-[20px] font-medium bg-red-500 text-white px-4 py-2 hover:bg-red-700 transition-all">
          No
        </button>
      </div>
    </div>
  </div>

  <script type="module">
    import confetti from 'https://cdn.skypack.dev/canvas-confetti';
    
    const yesButton = document.getElementById('yesButton');
    const noButton = document.getElementById('noButton');
    const imageDisplay = document.getElementById('imageDisplay');
    const valentineQuestion = document.getElementById('valentineQuestion');
    const responseButtons = document.getElementById('responseButtons');
    const music = document.getElementById('bgMusic');
  
    let noClickCount = 0;
    let yesSize = 20;
    let padding = 15;

    // List of images for each "No" click
    const images = [
      "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHIycXByZ3R3Z3R3Z3R3Z3R3Z3R3Z3R3Z3R3Z3R3Z3R3Z3R3ZiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/cLS1cfxvGOPVpf9g3y/giphy.gif",
      "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM2ZkbXozOWZ4Z3R3Z3R3Z3R3Z3R3Z3R3Z3R3Z3R3Z3R3Z3R3ZiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/OPU6wUKqz3Fry/giphy.gif",
      "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM2ZkbXozOWZ4Z3R3Z3R3Z3R3Z3R3Z3R3Z3R3Z3R3Z3R3Z3R3ZiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/26hpKz78Y9m/giphy.gif",
      "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM2ZkbXozOWZ4Z3R3Z3R3Z3R3Z3R3Z3R3Z3R3Z3R3Z3R3Z3R3ZiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/7SF5scGB2AFrO/giphy.gif"
    ];

    const messages = ["No", "Are you sure, Arshama?", "Pookie please...", "Don't do this to me :(", "I'm gonna cry..."];
  
    noButton.addEventListener('click', () => {
      if (noClickCount < messages.length - 1) {
        noClickCount++;
        // Update text and image
        noButton.textContent = messages[noClickCount];
        imageDisplay.src = images[noClickCount % images.length];
        
        // Make Yes button BIGGER
        yesSize += 30;
        padding += 15;
        yesButton.style.fontSize = `${yesSize}px`;
        yesButton.style.padding = `${padding}px`;
      }
    });
  
    yesButton.addEventListener('click', () => {
      imageDisplay.src = 'https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM2ZkbXozOWZ4Z3R3Z3R3Z3R3Z3R3Z3R3Z3R3Z3R3Z3R3Z3R3ZiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/l41lH4ADRtAYnGsLe/giphy.gif';
      valentineQuestion.textContent = "Yayyy!! I love you Arshama! ❤️";
      responseButtons.style.display = 'none';
      confetti();
      music.play(); // Titanic music starts here
    });
  </script>  
</body>
</html>
