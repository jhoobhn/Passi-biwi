<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Arshama ❤️</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .gradient-background {
      background: linear-gradient(180deg, #ffafbd 0%, #ffc3a0 100%);
    }
    .bounce {
      animation: bounce 2s infinite;
    }
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
      40% {transform: translateY(-20px);}
      60% {transform: translateY(-10px);}
    }
  </style>
</head>
<body class="gradient-background overflow-hidden">
  <audio id="bgMusic" loop>
    <source src="https://www.myinstants.com/media/sounds/titanic-theme-song.mp3" type="audio/mpeg">
  </audio>

  <div class="flex items-center justify-center h-screen relative z-10">
    <div class="flex flex-col items-center p-8 bg-white/40 backdrop-blur-lg rounded-3xl shadow-2xl text-center max-w-md mx-4 border border-white/20">
      
      <img id="imageDisplay" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHIycXByZ3R3Z3R3Z3R3Z3R3Z3R3Z3R3Z3R3Z3R3Z3R3Z3R3ZiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/cLS1cfxvGOPVpf9g3y/giphy.gif" alt="Cute bear" class="rounded-2xl h-[250px] w-full object-cover mb-6 shadow-md" />
      
      <h2 id="valentineQuestion" class="text-3xl font-extrabold italic text-[#be185d]">Will you be my Valentine, Arshama passi ? ❤️</h2>
      
      <div class="flex gap-4 pt-[30px] items-center" id="responseButtons">
        <button id="yesButton" class="bounce inline-flex items-center justify-center rounded-full text-[20px] font-bold bg-[#ff1e56] text-white px-8 py-3 shadow-lg hover:scale-110 transition-all duration-300">
          Yes! 💖
        </button>
        <button id="noButton" class="inline-flex items-center justify-center rounded-full text-[18px] font-medium bg-white text-[#ff1e56] px-6 py-2 shadow-sm border border-pink-200">
          No 😢
        </button>
      </div>
    </div>
  </div>

  <script type="module">
    import confetti from 'https://cdn.skypack.dev/canvas-confetti';
    
    const yesButton = document.getElementById('yesButton');
    const noButton = document.getElementById('noButton');
    const imageDisplay = document.getElementById('imageDisplay');
    const valentineQuestion = document.getElementById('valentineQuestion');
    const responseButtons = document.getElementById('responseButtons');
    const music = document.getElementById('bgMusic');
  
    let noClickCount = 0;
    let yesSize = 20;

    // Guaranteed working images for each "No" click
    const images = [
      "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHIycXByZ3R3Z3R3Z3R3Z3R3Z3R3Z3R3Z3R3Z3R3Z3R3Z3R3ZiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/cLS1cfxvGOPVpf9g3y/giphy.gif",
      "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM2ZkbXozOWZ4Z3R3Z3R3Z3R3Z3R3Z3R3Z3R3Z3R3Z3R3Z3R3ZiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/OPU6wUKqz3Fry/giphy.gif",
      "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM2ZkbXozOWZ4Z3R3Z3R3Z3R3Z3R3Z3R3Z3R3Z3R3Z3R3Z3R3ZiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/26hpKz78Y9m/giphy.gif"
    ];

    const messages = ["No", "Are you sure, Arshama?", "Pookie please...", "Don't do this to me :("];
  
    noButton.addEventListener('click', () => {
      if (noClickCount < messages.length - 1) {
        noClickCount++;
        noButton.textContent = messages[noClickCount];
        imageDisplay.src = images[noClickCount % images.length];
        
        // Grow the Yes button
        yesSize += 35;
        yesButton.style.fontSize = `${yesSize}px`;
        yesButton.style.padding = `${yesSize/2}px ${yesSize}px`;
      }
    });
  
    yesButton.addEventListener('click', () => {
      // Romantic Final Content
      imageDisplay.src = 'https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM2ZkbXozOWZ4Z3R3Z3R3Z3R3Z3R3Z3R3Z3R3Z3R3Z3R3Z3R3ZiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/l41lH4ADRtAYnGsLe/giphy.gif';
      valentineQuestion.innerHTML = "Yayyy!! I love you Arshama! ❤️<br><span class='text-xl mt-4 block'>You've made me the happiest person ever!</span>";
      responseButtons.style.display = 'none';
      
      confetti();
      music.play(); // Titanic song plays on "Yes"
    });
  </script>  
</body>
</html>
