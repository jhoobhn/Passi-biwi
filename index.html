<<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Arshama ❤️</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <audio id="bgMusic" loop>
        <source src="https://www.myinstants.com/media/sounds/titanic-theme-song.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <div id="main-card">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHIycXByZ3R3Z3R3Z3R3Z3R3Z3R3Z3R3Z3R3Z3R3Z3R3Z3R3ZiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/cLS1cfxvGOPVpf9g3y/giphy.gif" alt="Cute Bear" class="gif">
            <h1 id="question">Will you be my Valentine, Arshama? ❤️</h1>
            
            <div class="btn-group">
                <button id="yesBtn" onclick="celebrate()">Yes! 💖</button>
                <button id="noBtn" onmouseover="moveButton()">No 😢</button>
            </div>
        </div>

        <div id="success-message" class="hidden">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExYzhueXJueXJueXJueXJueXJueXJueXJueXJueXJueXJueXJueCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/26hpKz78Y9m/giphy.gif" alt="Happy" class="gif">
            <h1>My heart will go on for you, Arshama! 🥰</h1>
            <p>You've made me the happiest person ever!</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
